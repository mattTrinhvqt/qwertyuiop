<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mmood</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

  <style>
    :root {
      --mmood-blue: #0b2f5b;
      --mmood-blue-soft: #eaf1f8;
      --mmood-blue-selected: #eef4fa;
      --mmood-blue-border: #bfd1e3;

      --mmood-ink: #151515;
      --mmood-muted: #69718a;
      --mmood-track: #e8eaf0;
      --mmood-error: #b42318;
      --mmood-positive: #14823b;
      --mmood-white: #ffffff;
      --mmood-soft: #f8f8fb;

      --mmood-motion-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --app-max-width: 780px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--mmood-white);
    }

    body {
      color: var(--mmood-ink);
      font-family: 'Lato', sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input,
    textarea {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #fit {
      width: 100%;
      padding: 1px;
    }

    #app {
      width: min(calc(100% - 10px), var(--app-max-width));
      margin: 0 auto;
      padding: 12px 2px 18px;
    }

    .app-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }

    .app-title-wrap {
      min-width: 0;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      color: var(--mmood-ink);
      font-size: 25px;
      font-weight: 400;
      line-height: 1.1;
    }

    .data-state {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 5px;
      min-height: 20px;
      color: var(--mmood-muted);
      font-size: 11px;
      line-height: 1;
      white-space: nowrap;
    }

    .data-state-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--mmood-muted);
    }

    .data-state.is-live .data-state-dot {
      background: #e53935;
    }

    .data-state.is-saving .data-state-dot {
      background: #c27c00;
    }

    .gradient-line {
      height: 2px;
      margin: 10px 0 16px;
      background: linear-gradient(
        90deg,
        var(--mmood-white) 0%,
        var(--mmood-blue) 50%,
        var(--mmood-white) 100%
      );
    }

    .entry-form {
      display: grid;
      gap: 13px;
    }

    .field-label,
    .section-kicker {
      color: var(--mmood-muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .mood-row {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 6px;
      margin-top: 7px;
    }

    .mood-option {
      position: relative;
    }

    .mood-option input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .mood-option label {
      display: flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      color: var(--mmood-muted);
      background: var(--mmood-white);
      border: 1px solid var(--mmood-track);
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;

      transition:
        color 110ms ease,
        border-color 110ms ease,
        background-color 110ms ease,
        transform 110ms var(--mmood-motion-ease);
    }

    .mood-option input:checked + label {
      color: var(--mmood-white);
      background: var(--mmood-blue);
      border-color: var(--mmood-blue);
    }

    .mood-option input:focus-visible + label {
      outline: 2px solid var(--mmood-blue);
      outline-offset: 2px;
    }

    @media (hover: hover) and (pointer: fine) {
      .mood-option label:hover {
        color: var(--mmood-blue);
        border-color: var(--mmood-blue);
        transform: translateY(-1px);
      }

      .mood-option input:checked + label:hover {
        color: var(--mmood-white);
      }
    }

    .notes-input {
      display: block;
      width: 100%;
      min-height: 84px;
      resize: vertical;
      padding: 10px 11px;

      color: var(--mmood-ink);
      background: var(--mmood-white);

      border: 1px solid var(--mmood-track);
      border-radius: 6px;

      font-size: 16px;
      line-height: 1.45;
      outline: none;

      transition: border-color 110ms ease;
    }

    .notes-input:focus {
      border-color: var(--mmood-blue);
    }

    .form-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .timestamp-preview {
      color: var(--mmood-muted);
      font-size: 12px;
      line-height: 1.3;
    }

    .save-button {
      min-width: 104px;
      min-height: 40px;
      padding: 0 16px;

      color: var(--mmood-white);
      background: var(--mmood-ink);

      border: 1px solid var(--mmood-ink);
      border-radius: 6px;

      cursor: pointer;
      font-size: 14px;
      font-weight: 700;

      transition:
        background-color 110ms ease,
        border-color 110ms ease,
        opacity 110ms ease,
        transform 110ms var(--mmood-motion-ease);
    }

    .save-button:hover,
    .save-button:focus-visible {
      background: var(--mmood-blue);
      border-color: var(--mmood-blue);
      outline: none;
      transform: translateY(-1px);
    }

    .save-button:disabled {
      cursor: wait;
      opacity: 0.55;
      transform: none;
    }

    .status {
      min-height: 18px;
      margin-top: 7px;
      color: var(--mmood-muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .status.is-error {
      color: var(--mmood-error);
    }

    .status.is-success {
      color: var(--mmood-positive);
    }

    .history {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--mmood-track);
    }

    .history-heading-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .history-heading-row h2 {
      font-size: 18px;
      font-weight: 400;
      line-height: 1.2;
    }

    .range-tabs {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 2px;

      border: 1px solid var(--mmood-track);
      border-radius: 7px;
    }

    .range-tab {
      min-width: 42px;
      min-height: 30px;
      padding: 0 8px;

      color: var(--mmood-muted);
      background: transparent;

      border: 0;
      border-radius: 5px;

      cursor: pointer;
      font-size: 11px;
      font-weight: 700;

      transition:
        color 110ms ease,
        background-color 110ms ease,
        transform 110ms var(--mmood-motion-ease);
    }

    .range-tab.is-active {
      color: var(--mmood-blue);
      background: var(--mmood-blue-soft);
    }

    .range-tab:focus-visible {
      outline: 2px solid var(--mmood-blue);
      outline-offset: 1px;
    }

    @media (hover: hover) and (pointer: fine) {
      .range-tab:hover {
        transform: translateY(-1px);
      }
    }

    .history-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(235px, 0.8fr);
      gap: 14px;
      min-height: 310px;
    }

    .chart-panel,
    .notes-panel {
      min-width: 0;
    }

    .chart-shell {
      position: relative;
      height: 300px;
      min-height: 250px;
      padding: 8px 0 0;
    }

    .chart-shell canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    .empty-state {
      position: absolute;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 24px;

      color: var(--mmood-muted);
      font-size: 13px;
      text-align: center;
    }

    .chart-shell.is-empty .empty-state {
      display: flex;
    }

    .notes-panel {
      display: flex;
      min-height: 0;
      flex-direction: column;

      border-left: 1px solid var(--mmood-track);
      padding-left: 12px;
    }

    .notes-panel-title {
      display: flex;
      min-height: 30px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;

      color: var(--mmood-muted);
      font-size: 12px;
    }

    .notes-count {
      font-variant-numeric: tabular-nums;
    }

    .notes-list {
      height: 270px;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 4px;

      scrollbar-width: thin;
      scrollbar-color: rgba(105, 113, 138, 0.35) transparent;
    }

    .note-item {
      width: 100%;
      padding: 9px 8px 10px;

      color: var(--mmood-ink);
      background: transparent;

      border: 0;
      border-bottom: 1px solid var(--mmood-track);
      border-radius: 0;

      cursor: pointer;
      text-align: left;

      transition:
        background-color 110ms ease,
        border-color 110ms ease;

      will-change: transform;
    }

    .note-item:first-child {
      border-top: 1px solid var(--mmood-track);
    }

    .note-item.is-selected {
      background: var(--mmood-blue-selected);
      border-bottom-color: var(--mmood-blue-border);
    }

    .note-item:focus-visible {
      outline: 2px solid var(--mmood-blue);
      outline-offset: -2px;
    }

    .note-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .note-date {
      min-width: 0;
      color: var(--mmood-muted);
      font-size: 11px;
      line-height: 1.25;
    }

    .note-score {
      flex: 0 0 auto;
      color: var(--mmood-blue);
      font-size: 14px;
      font-weight: 700;
    }

    .note-text {
      color: var(--mmood-ink);
      font-size: 13px;
      line-height: 1.38;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .loading-row {
      padding: 18px 8px;
      color: var(--mmood-muted);
      font-size: 12px;
      text-align: center;
    }

    .summary-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 22px;
      margin-top: 10px;

      color: var(--mmood-muted);
      font-size: 11px;
    }

    .summary-row strong {
      color: var(--mmood-ink);
      font-weight: 700;
    }

    .hidden-frame {
      position: absolute;
      width: 1px;
      height: 1px;
      border: 0;
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 650px) {
      #app {
        width: min(calc(100% - 6px), 560px);
        padding-top: 10px;
      }

      .app-header {
        align-items: flex-start;
      }

      h1 {
        font-size: 23px;
      }

      .mood-row {
        gap: 4px;
      }

      .mood-option label {
        min-height: 40px;
        border-radius: 5px;
        font-size: 14px;
      }

      .history-heading-row {
        align-items: flex-start;
        flex-direction: column;
      }

      .range-tabs {
        align-self: stretch;
        justify-content: space-between;
      }

      .range-tab {
        flex: 1 1 0;
      }

      .history-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .chart-shell {
        height: 270px;
      }

      .notes-panel {
        border-top: 1px solid var(--mmood-track);
        border-left: 0;
        padding-top: 8px;
        padding-left: 0;
      }

      .notes-list {
        height: 245px;
      }
    }

    @media (max-width: 410px) {
      .mood-row {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }

      .form-bottom {
        align-items: stretch;
        flex-direction: column;
      }

      .save-button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app">

      <header class="app-header">
        <div class="app-title-wrap">
          <h1>Mmood</h1>
        </div>

        <div id="dataState" class="data-state" aria-live="polite">
          <span class="data-state-dot" aria-hidden="true"></span>
          <span id="dataStateText">Connecting…</span>
        </div>
      </header>

      <div class="gradient-line" aria-hidden="true"></div>

      <form id="entryForm" class="entry-form" autocomplete="off">

        <div>
          <div class="field-label">How are you feeling?</div>

          <div class="mood-row" role="radiogroup" aria-label="Mood score from 1 to 10">
            <div class="mood-option">
              <input type="radio" id="mood1" name="mood" value="1">
              <label for="mood1">1</label>
            </div>

            <div class="mood-option">
              <input type="radio" id="mood2" name="mood" value="2">
              <label for="mood2">2</label>
            </div>

            <div class="mood-option">
              <input type="radio" id="mood3" name="mood" value="3">
              <label for="mood3">3</label>
            </div>

            <div class="mood-option">
              <input type="radio" id="mood4" name="mood" value="4">
              <label for="mood4">4</label>
            </div>

            <div class="mood-option">
              <input type="radio" id="mood5" name="mood" value="5">
              <label for="mood5">5</label>
            </div>

            <div class="mood-option">
              <input type="radio" id="mood6" name="mood" value="6">
              <label for="mood6">6</label>
            </div>

            <div class="mood-option">
              <input type="radio" id="mood7" name="mood" value="7">
              <label for="mood7">7</label>
            </div>

            <div class="mood-option">
              <input type="radio" id="mood8" name="mood" value="8">
              <label for="mood8">8</label>
            </div>

            <div class="mood-option">
              <input type="radio" id="mood9" name="mood" value="9">
              <label for="mood9">9</label>
            </div>

            <div class="mood-option">
              <input type="radio" id="mood10" name="mood" value="10">
              <label for="mood10">10</label>
            </div>
          </div>
        </div>

        <div>
          <label class="field-label" for="notes">Notes</label>

          <textarea
            id="notes"
            class="notes-input"
            name="notes"
            maxlength="5000"
          ></textarea>
        </div>

        <div>
          <div class="form-bottom">
            <div id="timestampPreview" class="timestamp-preview">
              Date and time are saved automatically
            </div>

            <button id="saveButton" class="save-button" type="submit">
              Save entry
            </button>
          </div>

          <div
            id="formStatus"
            class="status"
            role="status"
            aria-live="polite"
          ></div>
        </div>
      </form>

      <section class="history" aria-labelledby="historyHeading">

        <div class="history-heading-row">
          <h2 id="historyHeading">Mood over time</h2>

          <div class="range-tabs" role="tablist" aria-label="Time range">
            <button
              class="range-tab"
              type="button"
              data-range="7"
              role="tab"
              aria-selected="false"
            >
              7D
            </button>

            <button
              class="range-tab is-active"
              type="button"
              data-range="30"
              role="tab"
              aria-selected="true"
            >
              30D
            </button>

            <button
              class="range-tab"
              type="button"
              data-range="90"
              role="tab"
              aria-selected="false"
            >
              90D
            </button>

            <button
              class="range-tab"
              type="button"
              data-range="all"
              role="tab"
              aria-selected="false"
            >
              All
            </button>
          </div>
        </div>

        <div class="history-grid">

          <div class="chart-panel">
            <div id="chartShell" class="chart-shell">
              <canvas
                id="moodChart"
                aria-label="Mood score over time"
              ></canvas>

              <div class="empty-state">
                No entries in this time range yet
              </div>
            </div>

            <div
              id="summaryRow"
              class="summary-row"
              aria-live="polite"
            ></div>
          </div>

          <aside class="notes-panel" aria-label="Mood notes">

            <div class="notes-panel-title">
              <span>Notes</span>
              <span id="notesCount" class="notes-count"></span>
            </div>

            <div
              id="notesList"
              class="notes-list"
              tabindex="0"
            >
              <div class="loading-row">
                Loading entries…
              </div>
            </div>
          </aside>
        </div>
      </section>

      <iframe
        id="mmoodSaveFrame"
        name="mmoodSaveFrame"
        class="hidden-frame"
        title="Mmood save response"
      ></iframe>

    </main>
  </div>

  <script>
    (() => {
      'use strict'

      const FLIP_DURATION_MS = 170
      const FLIP_EASING = 'cubic-bezier(0.22, 1, 0.36, 1)'

      const CONFIG = Object.freeze({
        backendUrl:
          'https://script.google.com/macros/s/AKfycbyVAVwOpdCbvwFe9jzOee0nk1v8mkafTChAuu15Dn81TyDADDEnRmI8LtP-U-qUhukgsA/exec',

        defaultRangeDays: 30,
        jsonpTimeoutMs: 20000,
        saveRefreshDelayMs: 700
      })

      const state = {
        entries: [],
        filteredEntries: [],
        selectedId: null,
        range: String(CONFIG.defaultRangeDays),
        chart: null,
        pendingSave: null,
        callbackCounter: 0,
        pendingNotePositions: null
      }

      const els = {
        entryForm: document.getElementById('entryForm'),
        notes: document.getElementById('notes'),
        saveButton: document.getElementById('saveButton'),
        formStatus: document.getElementById('formStatus'),
        timestampPreview: document.getElementById('timestampPreview'),
        dataState: document.getElementById('dataState'),
        dataStateText: document.getElementById('dataStateText'),
        chartShell: document.getElementById('chartShell'),
        moodChart: document.getElementById('moodChart'),
        notesList: document.getElementById('notesList'),
        notesCount: document.getElementById('notesCount'),
        summaryRow: document.getElementById('summaryRow'),
        saveFrame: document.getElementById('mmoodSaveFrame'),
        rangeTabs: Array.from(document.querySelectorAll('.range-tab'))
      }

      function backendReady() {
        return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/
          .test(CONFIG.backendUrl)
      }

      function setDataState(mode, text) {
        els.dataState.classList.toggle(
          'is-live',
          mode === 'live'
        )

        els.dataState.classList.toggle(
          'is-saving',
          mode === 'saving'
        )

        els.dataStateText.textContent = text
      }

      function setFormStatus(message, type = '') {
        els.formStatus.textContent = message

        els.formStatus.classList.toggle(
          'is-error',
          type === 'error'
        )

        els.formStatus.classList.toggle(
          'is-success',
          type === 'success'
        )
      }

      function formatDateTime(value) {
        const d = value instanceof Date
          ? value
          : new Date(value)

        if (Number.isNaN(d.getTime())) {
          return ''
        }

        return new Intl.DateTimeFormat(
          'en-AU',
          {
            day: '2-digit',
            month: 'short',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          }
        ).format(d)
      }

      function formatRoundedHour(value) {
        const d = value instanceof Date
          ? new Date(value)
          : new Date(value)

        if (Number.isNaN(d.getTime())) {
          return ''
        }

        if (d.getMinutes() >= 30) {
          d.setHours(d.getHours() + 1)
        }

        d.setMinutes(0, 0, 0)

        return new Intl.DateTimeFormat(
          'en-AU',
          {
            day: 'numeric',
            month: 'short',
            hour: 'numeric',
            hour12: true
          }
        ).format(d)
      }

      function updateTimestampPreview() {
        els.timestampPreview.textContent =
          'Will save as ' + formatDateTime(new Date())
      }

      function jsonp(params) {
        return new Promise((resolve, reject) => {
          if (!backendReady()) {
            reject(
              new Error(
                'Add your Apps Script web-app URL to CONFIG.backendUrl first'
              )
            )
            return
          }

          const callbackName =
            '__mmoodJsonp' + (++state.callbackCounter)

          const script =
            document.createElement('script')

          const timer =
            window.setTimeout(
              () => cleanup(
                new Error('The data request timed out')
              ),
              CONFIG.jsonpTimeoutMs
            )

          function cleanup(error, value) {
            window.clearTimeout(timer)

            delete window[callbackName]
            script.remove()

            if (error) {
              reject(error)
            } else {
              resolve(value)
            }
          }

          window[callbackName] =
            payload => cleanup(null, payload)

          const url =
            new URL(CONFIG.backendUrl)

          Object.entries(params)
            .forEach(([key, value]) => {
              url.searchParams.set(key, value)
            })

          url.searchParams.set(
            'callback',
            callbackName
          )

          url.searchParams.set(
            '_',
            Date.now().toString()
          )

          script.onerror =
            () => cleanup(
              new Error(
                'Could not reach the Mmood backend'
              )
            )

          script.src = url.toString()

          document.head.appendChild(script)
        })
      }

      async function fetchEntries() {
        const payload =
          await jsonp({
            action: 'list'
          })

        if (
          !payload ||
          payload.ok !== true ||
          !Array.isArray(payload.entries)
        ) {
          throw new Error(
            payload && payload.error
              ? payload.error
              : 'Unexpected response from backend'
          )
        }

        return payload.entries
          .map(item => ({
            id: String(item.id),
            timestamp: String(item.timestamp),
            epochMs: Number(item.epochMs),
            mood: Number(item.mood),
            notes: String(item.notes || '')
          }))
          .filter(item =>
            Number.isFinite(item.epochMs) &&
            Number.isFinite(item.mood)
          )
          .sort(
            (a, b) =>
              a.epochMs - b.epochMs
          )
      }

      async function loadEntries({
        preserveSelection = true
      } = {}) {
        if (!backendReady()) {
          setDataState(
            'offline',
            'Setup required'
          )

          els.notesList.innerHTML =
            '<div class="loading-row">Add the Apps Script web-app URL in the HTML to connect Mmood</div>'

          return
        }

        setDataState(
          'loading',
          'Loading…'
        )

        try {
          const previousSelection =
            preserveSelection
              ? state.selectedId
              : null

          state.entries =
            await fetchEntries()

          state.selectedId =
            previousSelection

          applyRange()

          setDataState(
            'live',
            'LIVE data'
          )
        } catch (error) {
          console.error(error)

          setDataState(
            'offline',
            'Unavailable'
          )

          els.notesList.innerHTML =
            '<div class="loading-row">Could not load entries</div>'

          setFormStatus(
            error.message ||
              'Could not load entries',
            'error'
          )
        }
      }

      function getRangeStart() {
        if (state.range === 'all') {
          return -Infinity
        }

        const days =
          Number(state.range)

        return (
          Date.now() -
          days * 24 * 60 * 60 * 1000
        )
      }

      function captureNotePositions() {
        const positions =
          new Map()

        els.notesList
          .querySelectorAll('.note-item')
          .forEach(item => {
            positions.set(
              item.dataset.id,
              item.getBoundingClientRect()
            )
          })

        return positions
      }

      function playNoteFlip(firstPositions) {
        if (
          !firstPositions ||
          window
            .matchMedia(
              '(prefers-reduced-motion: reduce)'
            )
            .matches
        ) {
          return
        }

        const items =
          Array.from(
            els.notesList
              .querySelectorAll('.note-item')
          )

        items.forEach(item => {
          const first =
            firstPositions.get(
              item.dataset.id
            )

          const last =
            item.getBoundingClientRect()

          if (first) {
            const dx =
              first.left - last.left

            const dy =
              first.top - last.top

            if (
              Math.abs(dx) > 0.5 ||
              Math.abs(dy) > 0.5
            ) {
              item.animate(
                [
                  {
                    transform:
                      `translate(${dx}px, ${dy}px)`
                  },
                  {
                    transform:
                      'translate(0, 0)'
                  }
                ],
                {
                  duration:
                    FLIP_DURATION_MS,

                  easing:
                    FLIP_EASING
                }
              )
            }
          } else {
            item.animate(
              [
                {
                  opacity: 0,
                  transform:
                    'translateY(-5px)'
                },
                {
                  opacity: 1,
                  transform:
                    'translateY(0)'
                }
              ],
              {
                duration: 130,
                easing: FLIP_EASING
              }
            )
          }
        })
      }

      function applyRange() {
        state.pendingNotePositions =
          captureNotePositions()

        const start =
          getRangeStart()

        state.filteredEntries =
          state.entries.filter(
            entry =>
              entry.epochMs >= start
          )

        if (
          !state.filteredEntries
            .some(
              entry =>
                entry.id ===
                state.selectedId
            )
        ) {
          state.selectedId =
            state.filteredEntries.length
              ? state.filteredEntries[
                  state.filteredEntries.length - 1
                ].id
              : null
        }

        renderAll()
      }

      function renderAll() {
        renderChart()
        renderNotes()
        renderSummary()
      }

      function renderSummary() {
        const items =
          state.filteredEntries

        if (!items.length) {
          els.summaryRow.innerHTML = ''
          return
        }

        const mean =
          items.reduce(
            (sum, item) =>
              sum + item.mood,
            0
          ) / items.length

        const latest =
          items[items.length - 1]

        els.summaryRow.innerHTML = [
          '<span><strong>' +
            items.length +
            '</strong> entr' +
            (
              items.length === 1
                ? 'y'
                : 'ies'
            ) +
            '</span>',

          '<span>Average <strong>' +
            mean.toFixed(1) +
            '</strong></span>',

          '<span>Latest <strong>' +
            latest.mood +
            '/10</strong></span>'
        ].join('')
      }

      /*
       * Custom x-axis tick marks
       *
       * Major ticks:
       * darker and longer
       *
       * Minor ticks:
       * shorter and lighter
       *
       * The interval adapts to the visible time span
       */
      const mmoodAxisTicksPlugin = {
        id: 'mmoodAxisTicks',

        afterDraw(chart) {
          const x =
            chart.scales.x

          if (!x) {
            return
          }

          const ctx =
            chart.ctx

          const min =
            x.min

          const max =
            x.max

          if (
            !Number.isFinite(min) ||
            !Number.isFinite(max)
          ) {
            return
          }

          const span =
            max - min

          const DAY =
            24 * 60 * 60 * 1000

          let minorStep
          let majorEvery

          if (span <= 8 * DAY) {
            minorStep =
              6 * 60 * 60 * 1000

            majorEvery = 4
          } else if (
            span <= 35 * DAY
          ) {
            minorStep = DAY
            majorEvery = 7
          } else if (
            span <= 100 * DAY
          ) {
            minorStep =
              7 * DAY

            majorEvery = 2
          } else {
            minorStep =
              7 * DAY

            majorEvery = 4
          }

          const first =
            Math.ceil(min / minorStep) *
            minorStep

          const axisY =
            x.bottom

          ctx.save()

          let index = 0

          for (
            let t = first;
            t <= max;
            t += minorStep
          ) {
            const px =
              x.getPixelForValue(t)

            if (
              px < x.left - 1 ||
              px > x.right + 1
            ) {
              continue
            }

            const major =
              index % majorEvery === 0

            ctx.beginPath()

            ctx.moveTo(
              Math.round(px) + 0.5,
              axisY
            )

            ctx.lineTo(
              Math.round(px) + 0.5,
              axisY +
                (
                  major
                    ? 6
                    : 3
                )
            )

            ctx.strokeStyle =
              major
                ? '#151515'
                : '#aeb4c0'

            ctx.lineWidth =
              major
                ? 1
                : 0.8

            ctx.stroke()

            index++
          }

          ctx.restore()
        }
      }

      Chart.register(
        mmoodAxisTicksPlugin
      )

      function renderChart() {
        const points =
          state.filteredEntries.map(
            entry => ({
              x: entry.epochMs,
              y: entry.mood,
              id: entry.id
            })
          )

        els.chartShell.classList.toggle(
          'is-empty',
          points.length === 0
        )

        const selectedIndex =
          state.filteredEntries
            .findIndex(
              entry =>
                entry.id ===
                state.selectedId
            )

        const pointRadius =
          points.map(
            (_, index) =>
              index === selectedIndex
                ? 6
                : 3.5
          )

        const pointBorderWidth =
          points.map(
            (_, index) =>
              index === selectedIndex
                ? 2
                : 1
          )

        if (state.chart) {
          state.chart
            .data
            .datasets[0]
            .data = points

          state.chart
            .data
            .datasets[0]
            .pointRadius =
              pointRadius

          state.chart
            .data
            .datasets[0]
            .pointBorderWidth =
              pointBorderWidth

          state.chart.update()
          return
        }

        state.chart =
          new Chart(
            els.moodChart,
            {
              type: 'line',

              data: {
                datasets: [
                  {
                    label: 'Mood',

                    data: points,

                    parsing: false,

                    borderColor:
                      '#0b2f5b',

                    backgroundColor:
                      '#0b2f5b',

                    pointBackgroundColor:
                      '#ffffff',

                    pointBorderColor:
                      '#0b2f5b',

                    pointRadius,

                    pointHoverRadius: 6,

                    pointBorderWidth,

                    borderWidth: 2,

                    tension: 0.22,

                    spanGaps: true
                  }
                ]
              },

              options: {
                responsive: true,

                maintainAspectRatio:
                  false,

                normalized: true,

                animation: {
                  duration: 170,
                  easing:
                    'easeOutQuart'
                },

                interaction: {
                  mode: 'nearest',
                  axis: 'xy',
                  intersect: false
                },

                onClick: (
                  _event,
                  elements
                ) => {
                  if (
                    !elements.length
                  ) {
                    return
                  }

                  const index =
                    elements[0].index

                  const entry =
                    state.filteredEntries[
                      index
                    ]

                  if (entry) {
                    selectEntry(
                      entry.id,
                      true
                    )
                  }
                },

                onHover: (
                  _event,
                  elements
                ) => {
                  if (
                    !elements.length
                  ) {
                    return
                  }

                  const index =
                    elements[0].index

                  const entry =
                    state.filteredEntries[
                      index
                    ]

                  if (
                    entry &&
                    entry.id !==
                      state.selectedId
                  ) {
                    selectEntry(
                      entry.id,
                      true,
                      false
                    )
                  }
                },

                plugins: {
                  legend: {
                    display: false
                  },

                  tooltip: {
                    displayColors: false,

                    callbacks: {
                      title: items => {
                        if (
                          !items.length
                        ) {
                          return ''
                        }

                        const entry =
                          state.filteredEntries[
                            items[0]
                              .dataIndex
                          ]

                        return entry
                          ? formatDateTime(
                              entry.timestamp
                            )
                          : ''
                      },

                      label:
                        context =>
                          'Mood: ' +
                          context
                            .parsed
                            .y +
                          '/10',

                      afterLabel:
                        context => {
                          const entry =
                            state.filteredEntries[
                              context
                                .dataIndex
                            ]

                          if (
                            !entry ||
                            !entry.notes
                          ) {
                            return ''
                          }

                          return (
                            entry.notes
                              .length > 90
                              ? entry.notes
                                  .slice(
                                    0,
                                    87
                                  ) +
                                '…'
                              : entry.notes
                          )
                        }
                    }
                  }
                },

                layout: {
                  padding: {
                    bottom: 6
                  }
                },

                scales: {
                  x: {
                    type: 'time',

                    time: {
                      tooltipFormat:
                        'd MMM yyyy, h:mm a',

                      displayFormats: {
                        hour:
                          'd MMM h a',

                        day:
                          'd MMM',

                        week:
                          'd MMM',

                        month:
                          'MMM yyyy'
                      }
                    },

                    grid: {
                      display: false,
                      drawTicks: false
                    },

                    border: {
                      display: true,
                      color: '#151515',
                      width: 1
                    },

                    ticks: {
                      color: '#69718a',

                      padding: 7,

                      maxRotation: 0,

                      autoSkip: true,

                      maxTicksLimit: 6,

                      callback:
                        value =>
                          formatRoundedHour(
                            value
                          ),

                      font: {
                        family: 'Lato',
                        size: 10
                      }
                    }
                  },

                  y: {
                    min: 1,
                    max: 10,

                    ticks: {
                      stepSize: 1,

                      color:
                        '#69718a',

                      font: {
                        family:
                          'Lato',

                        size: 10
                      }
                    },

                    grid: {
                      color:
                        '#e8eaf0',

                      lineWidth: 1
                    },

                    border: {
                      display: true,

                      color:
                        '#151515',

                      width: 1
                    }
                  }
                }
              }
            }
          )
      }

      function renderNotes() {
        /*
         * Only entries containing actual
         * note text appear here
         *
         * Blank-note mood entries remain
         * on the graph
         */
        const items =
          [...state.filteredEntries]
            .filter(
              entry =>
                entry.notes
                  .trim() !== ''
            )
            .reverse()

        els.notesCount.textContent =
          items.length
            ? items.length +
              ' shown'
            : ''

        if (!items.length) {
          els.notesList.innerHTML =
            '<div class="loading-row">No notes in this time range</div>'

          state.pendingNotePositions =
            null

          return
        }

        els.notesList.innerHTML = ''

        items.forEach(entry => {
          const button =
            document.createElement(
              'button'
            )

          button.type = 'button'

          button.className =
            'note-item' +
            (
              entry.id ===
              state.selectedId
                ? ' is-selected'
                : ''
            )

          button.dataset.id =
            entry.id

          button.setAttribute(
            'aria-pressed',
            entry.id ===
              state.selectedId
              ? 'true'
              : 'false'
          )

          const meta =
            document.createElement(
              'div'
            )

          meta.className =
            'note-meta'

          const date =
            document.createElement(
              'span'
            )

          date.className =
            'note-date'

          date.textContent =
            formatDateTime(
              entry.timestamp
            )

          const score =
            document.createElement(
              'span'
            )

          score.className =
            'note-score'

          score.textContent =
            entry.mood + '/10'

          meta.append(
            date,
            score
          )

          const text =
            document.createElement(
              'div'
            )

          text.className =
            'note-text'

          text.textContent =
            entry.notes

          button.append(
            meta,
            text
          )

          button.addEventListener(
            'click',
            () =>
              selectEntry(
                entry.id,
                false
              )
          )

          els.notesList
            .appendChild(button)
        })

        playNoteFlip(
          state.pendingNotePositions
        )

        state.pendingNotePositions =
          null

        scrollSelectedNoteIntoView(
          false
        )
      }

      function selectEntry(
        id,
        scrollNote = true,
        chartUpdate = true
      ) {
        state.selectedId =
          String(id)

        const buttons =
          els.notesList
            .querySelectorAll(
              '.note-item'
            )

        buttons.forEach(button => {
          const active =
            button.dataset.id ===
            state.selectedId

          button.classList.toggle(
            'is-selected',
            active
          )

          button.setAttribute(
            'aria-pressed',
            active
              ? 'true'
              : 'false'
          )
        })

        if (
          chartUpdate &&
          state.chart
        ) {
          const selectedIndex =
            state.filteredEntries
              .findIndex(
                entry =>
                  entry.id ===
                  state.selectedId
              )

          state.chart
            .data
            .datasets[0]
            .pointRadius =
              state.filteredEntries
                .map(
                  (_, index) =>
                    index ===
                    selectedIndex
                      ? 6
                      : 3.5
                )

          state.chart
            .data
            .datasets[0]
            .pointBorderWidth =
              state.filteredEntries
                .map(
                  (_, index) =>
                    index ===
                    selectedIndex
                      ? 2
                      : 1
                )

          state.chart.update(
            'none'
          )
        }

        if (scrollNote) {
          scrollSelectedNoteIntoView(
            true
          )
        }
      }

      function scrollSelectedNoteIntoView(
        smooth
      ) {
        if (!state.selectedId) {
          return
        }

        const item =
          els.notesList
            .querySelector(
              '.note-item[data-id="' +
                CSS.escape(
                  state.selectedId
                ) +
                '"]'
            )

        /*
         * An entry may legitimately
         * have no note and therefore
         * no matching note row
         */
        if (!item) {
          return
        }

        item.scrollIntoView({
          block: 'nearest',

          behavior:
            smooth &&
            !window
              .matchMedia(
                '(prefers-reduced-motion: reduce)'
              )
              .matches
              ? 'smooth'
              : 'auto'
        })
      }

      function getSelectedMood() {
        const checked =
          document.querySelector(
            'input[name="mood"]:checked'
          )

        return checked
          ? Number(
              checked.value
            )
          : null
      }

      function submitEntry() {
        const mood =
          getSelectedMood()

        const notes =
          els.notes.value.trim()

        if (!mood) {
          setFormStatus(
            'Choose a mood score from 1 to 10',
            'error'
          )

          return
        }

        if (!backendReady()) {
          setFormStatus(
            'Add your deployed Apps Script URL to CONFIG.backendUrl first',
            'error'
          )

          return
        }

        const beforeIds =
          new Set(
            state.entries.map(
              entry => entry.id
            )
          )

        const startedAt =
          Date.now()

        state.pendingSave = {
          mood,
          notes,
          beforeIds,
          startedAt
        }

        els.saveButton.disabled =
          true

        els.saveButton.textContent =
          'Saving…'

        setDataState(
          'saving',
          'Saving…'
        )

        setFormStatus('')

        const form =
          document.createElement(
            'form'
          )

        form.method = 'POST'
        form.action =
          CONFIG.backendUrl
        form.target =
          'mmoodSaveFrame'
        form.style.display =
          'none'

        const fields = {
          action: 'add',
          mood: String(mood),
          notes
        }

        Object.entries(fields)
          .forEach(
            ([name, value]) => {
              const input =
                document.createElement(
                  'input'
                )

              input.type =
                'hidden'

              input.name =
                name

              input.value =
                value

              form.appendChild(
                input
              )
            }
          )

        document.body.appendChild(
          form
        )

        form.submit()
        form.remove()
      }

      async function confirmSavedFromFrame() {
        const pending =
          state.pendingSave

        if (!pending) {
          return
        }

        let matchedEntry =
          null

        try {
          const entries =
            await fetchEntries()

          matchedEntry =
            [...entries]
              .reverse()
              .find(
                entry =>
                  !pending
                    .beforeIds
                    .has(
                      entry.id
                    ) &&

                  entry.mood ===
                    pending.mood &&

                  entry.notes ===
                    pending.notes &&

                  entry.epochMs >=
                    pending
                      .startedAt -
                      5000
              ) || null

          state.entries =
            entries
        } catch (error) {
          console.error(error)
        }

        state.pendingSave =
          null

        finishSaveSuccess(
          matchedEntry
        )

        /*
         * If Apps Script finished the
         * POST before the Sheet list
         * endpoint reflected the new row,
         * refresh again shortly afterward
         *
         * This is not treated as an error
         */
        if (!matchedEntry) {
          window.setTimeout(
            () => {
              loadEntries({
                preserveSelection:
                  false
              })
            },
            CONFIG
              .saveRefreshDelayMs
          )
        }
      }

      function finishSaveSuccess(
        newEntry
      ) {
        els.saveButton.disabled =
          false

        els.saveButton.textContent =
          'Save entry'

        setDataState(
          'live',
          'LIVE data'
        )

        setFormStatus(
          'Saved ' +
            formatDateTime(
              newEntry
                ? newEntry.timestamp
                : new Date()
            ),
          'success'
        )

        document
          .querySelectorAll(
            'input[name="mood"]'
          )
          .forEach(input => {
            input.checked =
              false
          })

        els.notes.value = ''

        updateTimestampPreview()

        if (
          newEntry &&
          newEntry.id
        ) {
          state.selectedId =
            String(
              newEntry.id
            )

          applyRange()

          selectEntry(
            String(
              newEntry.id
            ),
            true
          )
        } else {
          applyRange()
        }
      }

      els.saveFrame.addEventListener(
        'load',
        () => {
          if (
            state.pendingSave
          ) {
            confirmSavedFromFrame()
          }
        }
      )

      els.entryForm.addEventListener(
        'submit',
        event => {
          event.preventDefault()
          submitEntry()
        }
      )

      els.rangeTabs.forEach(
        button => {
          button.addEventListener(
            'click',
            () => {
              state.range =
                button.dataset.range

              els.rangeTabs
                .forEach(tab => {
                  const active =
                    tab === button

                  tab.classList.toggle(
                    'is-active',
                    active
                  )

                  tab.setAttribute(
                    'aria-selected',
                    active
                      ? 'true'
                      : 'false'
                  )
                })

              applyRange()
            }
          )
        }
      )

      updateTimestampPreview()

      window.setInterval(
        updateTimestampPreview,
        30000
      )

      loadEntries({
        preserveSelection: false
      })
    })()
  </script>
</body>
</html>
