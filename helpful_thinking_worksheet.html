<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Helpful Thinking Worksheet</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --mmood-blue:#0b2f5b;
      --mmood-blue-soft:#eaf1f8;
      --mmood-blue-selected:#eef4fa;
      --mmood-blue-border:#bfd1e3;
      --mmood-ink:#151515;
      --mmood-muted:#69718a;
      --mmood-track:#e8eaf0;
      --mmood-error:#b42318;
      --mmood-positive:#14823b;
      --mmood-white:#ffffff;
      --app-max-width:1180px;
      --mmood-motion-ease:cubic-bezier(0.22,1,0.36,1);
    }

    *,*::before,*::after{box-sizing:border-box}

    html,body{
      width:100%;
      margin:0;
      padding:0;
      background:var(--mmood-white);
    }

    body{
      color:var(--mmood-ink);
      font-family:'Lato',Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    button,textarea{font:inherit}

    #fit{width:100%;padding:1px}

    #app{
      width:min(calc(100% - 10px),var(--app-max-width));
      margin:0 auto;
      padding:12px 2px 18px;
    }

    .app-header{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:16px;
      margin-bottom:10px;
    }

    h1,p{margin:0}

    h1{
      color:var(--mmood-ink);
      font-size:25px;
      font-weight:400;
      line-height:1.1;
    }

    .data-state{
      display:inline-flex;
      flex:0 0 auto;
      align-items:center;
      gap:5px;
      min-height:20px;
      color:var(--mmood-muted);
      font-size:11px;
      line-height:1;
      white-space:nowrap;
    }

    .data-state-dot{
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--mmood-muted);
    }

    .data-state.is-live .data-state-dot{background:#e53935}
    .data-state.is-saving .data-state-dot{background:#c27c00}
    .data-state.is-error{color:var(--mmood-error)}
    .data-state.is-error .data-state-dot{background:var(--mmood-error)}

    .gradient-line{
      height:2px;
      margin:10px 0 16px;
      background:linear-gradient(
        90deg,
        var(--mmood-white) 0%,
        var(--mmood-blue) 50%,
        var(--mmood-white) 100%
      );
    }

    .table-shell{
      position:relative;
      width:100%;
      overflow:hidden;
      background:var(--mmood-white);
      border-bottom:1px solid var(--mmood-track);
    }

    .table-scroll{
      width:100%;
      /* No nested height-limited scroller: let Google Sites / the page
         control vertical scrolling, not the table and the iframe both. */
      max-height:none;
      overflow-x:auto;
      overflow-y:visible;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:thin;
      scrollbar-color:rgba(105,113,138,.35) transparent;
    }

    table{
      width:100%;
      min-width:100%;
      border-collapse:separate;
      border-spacing:0;
      table-layout:fixed;
    }

    /* A compact date column and content-led widths calculated in JS. */
    col.date{width:100px}

    th,td{
      padding:8px 5px;
      border-right:1px solid var(--mmood-track);
      border-bottom:1px solid var(--mmood-track);
      text-align:left;
      vertical-align:top;
    }

    th:last-child,td:last-child{border-right:0}

    thead th{
      position:sticky;
      top:0;
      z-index:5;
      color:var(--mmood-muted);
      background:var(--mmood-white);
      border-bottom:1px solid var(--mmood-ink);
      font-size:11px;
      font-weight:700;
      letter-spacing:.02em;
      line-height:1.2;
      text-transform:uppercase;
    }

    tbody td{
      color:var(--mmood-ink);
      background:var(--mmood-white);
      font-size:13px;
      line-height:1.45;
      white-space:normal;
      overflow-wrap:anywhere;
      word-break:normal;
      hyphens:auto;
    }

    tbody tr.data-row:hover td{background:var(--mmood-blue-selected)}

    thead th:first-child,
    tbody td:first-child{
      position:sticky;
      left:0;
      z-index:3;
      box-shadow:1px 0 0 var(--mmood-track);
    }

    thead th:first-child{z-index:6}
    tbody tr.data-row:hover td:first-child{background:var(--mmood-blue-selected)}

    .date-cell{
      width:1%;
      min-width:90px;
      color:var(--mmood-muted);
      font-size:12px;
      white-space:nowrap;
      font-variant-numeric:tabular-nums;
    }

    /* Visually distinguish intentionally blank saved cells. */
    .empty-cell{
      color:var(--mmood-muted);
      text-align:center;
    }

    /* New-entry row stays directly below the sticky heading. */
    .new-entry-row td{
      position:sticky;
      top:var(--table-head-height, 33px);
      z-index:4;
      padding:5px;
      background:var(--mmood-white);
      border-bottom:1px solid var(--mmood-blue-border);
      vertical-align:top;
    }

    .new-entry-row td:first-child{
      z-index:5;
      background:var(--mmood-white);
    }

    .new-entry-marker{
      display:inline-flex;
      align-items:center;
      gap:6px;
      min-height:31px;
      padding:0 2px;
      color:var(--mmood-blue);
      font-size:11px;
      font-weight:700;
      white-space:nowrap;
    }

    .plus-mark{
      display:inline-flex;
      width:22px;
      height:22px;
      align-items:center;
      justify-content:center;
      border:1px solid var(--mmood-blue-border);
      border-radius:50%;
      background:var(--mmood-blue-soft);
      color:var(--mmood-blue);
      font-size:17px;
      font-weight:400;
      line-height:1;
    }

    .entry-input{
      display:block;
      width:100%;
      min-height:50px;
      max-height:180px;
      min-width:0;
      resize:none;
      overflow-y:auto;
      padding:5px 3px;
      color:var(--mmood-ink);
      background:transparent;
      border:1px solid transparent;
      border-radius:5px;
      outline:none;
      font-size:13px;
      line-height:1.4;
      transition:background-color 110ms ease,border-color 110ms ease;
    }

    .entry-input::placeholder{color:#9aa1b2}

    .entry-input:focus{
      background:var(--mmood-white);
      border-color:var(--mmood-blue);
    }

    .entry-input:focus-visible{
      outline:2px solid var(--mmood-blue);
      outline-offset:1px;
    }

    .replace-editor{
      display:flex;
      align-items:flex-start;
      gap:6px;
    }

    .replace-editor .entry-input{min-width:0}

    .save-button{
      flex:0 0 auto;
      min-width:54px;
      height:32px;
      margin-top:1px;
      padding:0 10px;
      color:var(--mmood-white);
      background:var(--mmood-ink);
      border:1px solid var(--mmood-ink);
      border-radius:5px;
      cursor:pointer;
      font-size:11px;
      font-weight:700;
      transition:
        background-color 110ms ease,
        border-color 110ms ease,
        opacity 110ms ease,
        transform 110ms var(--mmood-motion-ease);
    }

    .save-button:hover,
    .save-button:focus-visible{
      background:var(--mmood-blue);
      border-color:var(--mmood-blue);
      outline:none;
      transform:translateY(-1px);
    }

    .save-button:disabled{
      cursor:wait;
      opacity:.5;
      transform:none;
    }

    /* Feedback is invisible until saving or an error. No permanent status row. */
    .entry-status{
      margin:5px 2px 0;
      color:var(--mmood-muted);
      font-size:11px;
      line-height:1.35;
    }

    .entry-status[hidden]{display:none}
    .entry-status.is-success{color:var(--mmood-positive)}
    .entry-status.is-error{color:var(--mmood-error)}

    .empty-state,
    .error-state,
    .loading-state{
      padding:28px 16px;
      color:var(--mmood-muted);
      font-size:13px;
      line-height:1.5;
      text-align:center;
    }

    .error-state{color:var(--mmood-error)}

    .loading-bar{
      height:2px;
      overflow:hidden;
      background:var(--mmood-track);
    }

    .loading-bar::after{
      content:'';
      display:block;
      width:35%;
      height:100%;
      background:var(--mmood-blue);
      animation:loading 1.1s ease-in-out infinite;
    }

    @keyframes loading{
      0%{transform:translateX(-120%)}
      100%{transform:translateX(360%)}
    }

    .hidden-frame{
      position:absolute;
      width:1px;
      height:1px;
      border:0;
      opacity:0;
      pointer-events:none;
    }

    .mobile-entry-toggle-row{display:none}

    /* At phone/tablet widths, preserve the worksheet as one continuous
       full-width reading surface. Each saved row is a labelled mini-table,
       and the entry row uses the same labels; there is NO sideways scroll. */
    @media(max-width:700px){
      #app{
        width:min(calc(100% - 8px),var(--app-max-width));
        padding-top:9px;
      }

      h1{font-size:22px}
      .app-header{align-items:center}
      .gradient-line{margin-bottom:9px}
      .table-scroll{
        width:100%;
        max-height:none;
        overflow:visible;
      }
      .table-shell{overflow:visible}
      table{
        display:block;
        width:100%;
        min-width:0;
        table-layout:auto;
      }
      colgroup,thead{display:none}
      tbody{display:block;width:100%}
      tbody tr{display:block;width:100%}

      /* Compact, accessible one-line editor toggle. */
      .mobile-entry-toggle-row{display:block}
      .mobile-entry-toggle-row td,
      .mobile-entry-toggle-row td:first-child{
        display:block;
        position:static;
        width:100%;
        padding:0;
        border:0;
        background:var(--mmood-white);
        box-shadow:none;
      }
      .mobile-entry-toggle{
        display:flex;
        align-items:center;
        gap:9px;
        width:100%;
        min-height:40px;
        padding:6px 8px;
        border:0;
        border-bottom:1px solid var(--mmood-track);
        background:var(--mmood-white);
        color:var(--mmood-ink);
        font-size:12px;
        font-weight:700;
        text-align:left;
        cursor:pointer;
      }
      .mobile-entry-toggle:focus-visible{
        outline:2px solid var(--mmood-blue);
        outline-offset:-2px;
      }
      .mobile-entry-toggle:hover{background:var(--mmood-blue-selected)}
      .mobile-entry-toggle .plus-mark{width:21px;height:21px}
      .mobile-entry-date{
        margin-left:auto;
        color:var(--mmood-muted);
        font-size:11px;
        font-weight:400;
        white-space:nowrap;
      }
      .mobile-entry-chevron{
        width:7px;
        height:7px;
        margin:0 3px 3px 2px;
        border-right:1.5px solid var(--mmood-muted);
        border-bottom:1.5px solid var(--mmood-muted);
        transform:rotate(45deg);
        transition:transform 120ms ease;
      }
      .mobile-entry-toggle[aria-expanded="true"] .mobile-entry-chevron{
        transform:rotate(225deg) translate(-2px,-2px);
      }

      .new-entry-row{
        display:none;
        grid-template-columns:minmax(0,1fr);
        padding:6px 6px 9px;
        background:var(--mmood-white);
        border-bottom:1px solid var(--mmood-blue-border);
      }
      .new-entry-row.is-open{display:grid}
      .new-entry-row td,
      .new-entry-row td:first-child{
        display:block;
        position:static;
        top:auto;
        z-index:auto;
        width:100%;
        min-width:0;
        padding:4px 2px;
        background:var(--mmood-white);
        border:0;
        box-shadow:none;
      }
      /* The collapsed mobile toggle already shows + and today's date. */
      .new-entry-row td:first-child{display:none}
      .new-entry-row td:not(:first-child)::before{
        display:block;
        content:attr(data-label);
        margin:0 0 1px;
        color:var(--mmood-muted);
        font-size:10px;
        font-weight:700;
        line-height:1.3;
      }
      .new-entry-marker{min-height:27px;padding:0 1px}
      .plus-mark{width:20px;height:20px;font-size:16px}
      .entry-input{
        width:100%;
        height:38px;
        min-height:38px;
        max-height:none;
        padding:7px 8px;
        font-size:13px;
        line-height:1.4;
        border:1px solid var(--mmood-track);
        border-radius:5px;
        overflow:hidden;
      }
      .replace-editor{display:flex;flex-direction:column;gap:7px}
      .replace-editor .entry-input{flex:0 0 auto}
      .save-button{
        align-self:flex-end;
        margin:0;
        height:35px;
        min-width:86px;
      }
      .entry-status{margin:5px 2px 0}

      .data-row{
        padding:7px 6px;
        border-bottom:1px solid var(--mmood-track);
      }
      .data-row td,
      .data-row td:first-child{
        display:grid;
        grid-template-columns:90px minmax(0,1fr);
        gap:7px;
        position:static;
        z-index:auto;
        width:100%;
        min-width:0;
        padding:4px 2px;
        border:0;
        box-shadow:none;
        background:transparent!important;
        color:var(--mmood-ink);
        text-align:left;
        font-size:12px;
        line-height:1.35;
        white-space:normal;
        overflow-wrap:anywhere;
      }
      .data-row td::before{
        content:attr(data-label);
        color:var(--mmood-muted);
        font-size:10px;
        font-weight:700;
        line-height:1.4;
      }
      .data-row .date-cell{color:var(--mmood-blue)}
      .data-row .empty-cell{color:var(--mmood-muted)}
      .data-row:hover td{background:transparent!important}

      .loading-state,.empty-state,.error-state{
        display:block;
        padding:20px 10px;
        border:0;
      }
    }

    @media(max-width:430px){
      .app-header{
        align-items:flex-start;
        flex-direction:column;
        gap:5px;
      }
      .data-row td,
      .data-row td:first-child{grid-template-columns:80px minmax(0,1fr)}
    }

    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        scroll-behavior:auto!important;
      }
    }
  </style>
</head>

<body>
  <div id="fit">
    <main id="app">
      <header class="app-header">
        <h1>Helpful Thinking Worksheet</h1>

        <div id="dataState" class="data-state" aria-live="polite">
          <span class="data-state-dot" aria-hidden="true"></span>
          <span id="dataStateText">Connecting…</span>
        </div>
      </header>

      <div class="gradient-line" aria-hidden="true"></div>

      <div class="table-shell">
        <div id="loadingBar" class="loading-bar" aria-hidden="true"></div>

        <div class="table-scroll" tabindex="0" aria-label="Helpful Thinking Worksheet">
          <form id="entryForm">
            <table>
              <colgroup>
                <col class="date">
                <col class="situation">
                <col class="awareness">
                <col class="analysis">
                <col class="challenge">
                <col class="replace">
              </colgroup>

              <thead>
                <tr id="tableHead"></tr>
              </thead>

              <tbody id="tableBody">
                <tr class="mobile-entry-toggle-row">
                  <td colspan="6">
                    <button
                      id="mobileEntryToggle"
                      type="button"
                      class="mobile-entry-toggle"
                      aria-expanded="false"
                      aria-controls="newEntryRow"
                    >
                      <span class="plus-mark" aria-hidden="true">+</span>
                      <span id="mobileEntryLabel">New entry</span>
                      <span id="mobileTodayLabel" class="mobile-entry-date">Today</span>
                      <span class="mobile-entry-chevron" aria-hidden="true"></span>
                    </button>
                  </td>
                </tr>
                <tr id="newEntryRow" class="new-entry-row">
                  <td>
                    <div class="new-entry-marker" title="New entry">
                      <span class="plus-mark" aria-hidden="true">+</span>
                      <span id="todayLabel">Today</span>
                    </div>
                  </td>

                  <td data-label="Situation">
                    <textarea
                      id="situation"
                      class="entry-input"
                      maxlength="5000"
                      placeholder="Type here…"
                      aria-label="New entry: Situation"
                    ></textarea>
                  </td>

                  <td data-label="Awareness">
                    <textarea
                      id="awareness"
                      class="entry-input"
                      maxlength="5000"
                      placeholder="Type here…"
                      aria-label="New entry: Awareness"
                    ></textarea>
                  </td>

                  <td data-label="Self-analysis">
                    <textarea
                      id="selfAnalysis"
                      class="entry-input"
                      maxlength="5000"
                      placeholder="Type here…"
                      aria-label="New entry: Self-analysis"
                    ></textarea>
                  </td>

                  <td data-label="Challenge">
                    <textarea
                      id="challenge"
                      class="entry-input"
                      maxlength="5000"
                      placeholder="Type here…"
                      aria-label="New entry: Challenge"
                    ></textarea>
                  </td>

                  <td data-label="Replace">
                    <div class="replace-editor">
                      <textarea
                        id="replace"
                        class="entry-input"
                        maxlength="5000"
                        placeholder="Type here…"
                        aria-label="New entry: Replace"
                      ></textarea>

                      <button id="saveButton" class="save-button" type="submit">
                        Save
                      </button>
                    </div>
                    <div id="entryStatus" class="entry-status" role="status" aria-live="polite" hidden></div>
                  </td>
                </tr>

                <tr id="loadingRow">
                  <td colspan="6" class="loading-state">Loading entries…</td>
                </tr>
              </tbody>
            </table>
          </form>
        </div>
      </div>
      <iframe id="htwSaveFrame" name="htwSaveFrame" class="hidden-frame" title="Save worksheet entry"></iframe>
    </main>
  </div>

  <script>
    (() => {
      'use strict';

      // This is the HELPFUL THINKING WORKSHEET backend, not the Mmood backend.
      const CONFIG = Object.freeze({
        backendUrl: 'https://script.google.com/macros/s/AKfycbxu3Wfh7VJZ48_Z4s0n_t8GIgfeJByTnol0j9UiQrlwjHy7MZD-ULfS4oSGJ4youewt/exec',
        refreshMs: 60000,
        loadTimeoutMs: 20000,
        saveTimeoutMs: 22000
      });

      const HEADERS = ['Date','Situation','Awareness','Self-analysis','Challenge','Replace'];
      const state = { entries: [], pendingSave: null, callbackCounter: 0, busyLoading: false, hasLoaded: false };
      const els = {
        dataState: document.getElementById('dataState'),
        dataStateText: document.getElementById('dataStateText'),
        tableHead: document.getElementById('tableHead'),
        tableBody: document.getElementById('tableBody'),
        loadingBar: document.getElementById('loadingBar'),
        entryForm: document.getElementById('entryForm'),
        situation: document.getElementById('situation'),
        awareness: document.getElementById('awareness'),
        selfAnalysis: document.getElementById('selfAnalysis'),
        challenge: document.getElementById('challenge'),
        replace: document.getElementById('replace'),
        saveButton: document.getElementById('saveButton'),
        entryStatus: document.getElementById('entryStatus'),
        todayLabel: document.getElementById('todayLabel'),
        mobileTodayLabel: document.getElementById('mobileTodayLabel'),
        mobileEntryToggle: document.getElementById('mobileEntryToggle'),
        mobileEntryLabel: document.getElementById('mobileEntryLabel'),
        newEntryRow: document.getElementById('newEntryRow'),
        saveFrame: document.getElementById('htwSaveFrame')
      };

      function setDataState(mode, message) {
        els.dataState.classList.toggle('is-live', mode === 'live');
        els.dataState.classList.toggle('is-saving', mode === 'saving');
        els.dataState.classList.toggle('is-error', mode === 'error');
        els.dataStateText.textContent = message;
      }

      let statusClearTimer = null;
      function setEntryStatus(message, mode = '') {
        window.clearTimeout(statusClearTimer);
        els.entryStatus.textContent = message;
        els.entryStatus.hidden = !message;
        els.entryStatus.classList.toggle('is-success', mode === 'success');
        els.entryStatus.classList.toggle('is-error', mode === 'error');
        if (message && mode === 'success') {
          statusClearTimer = window.setTimeout(() => setEntryStatus(''), 4500);
        }
      }

      function setLoading(active) {
        els.loadingBar.hidden = !active;
      }

      function backendReady() {
        return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(CONFIG.backendUrl);
      }

      // GitHub pages cannot call google.script.run. Use a script-tag JSONP read,
      // as Mmood does, avoiding a CORS-blocked fetch.
      function jsonp(action) {
        return new Promise((resolve,reject) => {
          if (!backendReady()) {
            reject(new Error('Add the worksheet Apps Script /exec URL to CONFIG.backendUrl.'));
            return;
          }

          const callback = '__htwCallback' + (++state.callbackCounter);
          const script = document.createElement('script');
          let finished = false;
          const timeout = window.setTimeout(() => finish(new Error('Data request timed out.')),CONFIG.loadTimeoutMs);

          function finish(error,payload) {
            if (finished) return;
            finished = true;
            window.clearTimeout(timeout);
            try { delete window[callback]; } catch (_) { window[callback] = undefined; }
            script.remove();
            if (error) reject(error);
            else resolve(payload);
          }

          window[callback] = payload => finish(null,payload);
          const url = new URL(CONFIG.backendUrl);
          url.searchParams.set('action',action);
          url.searchParams.set('callback',callback);
          url.searchParams.set('_',String(Date.now()));
          script.onerror = () => finish(new Error('Could not reach the worksheet backend. Check deployment access and URL.'));
          script.src = url.toString();
          document.head.appendChild(script);
        });
      }

      function updateStickyHeaderOffset() {
        window.requestAnimationFrame(() => {
          const height = Math.ceil(els.tableHead.getBoundingClientRect().height || 33);
          document.documentElement.style.setProperty('--table-head-height',height + 'px');
        });
      }

      function renderHeaders(headers) {
        els.tableHead.replaceChildren();
        (Array.isArray(headers) ? headers : HEADERS).slice(0,6).forEach(name => {
          const th=document.createElement('th');
          th.scope='col';
          th.textContent=String(name);
          els.tableHead.appendChild(th);
        });
        updateStickyHeaderOffset();
      }

      function removeDataRows() {
        els.tableBody.querySelectorAll('.data-row,.empty-data-row,.error-data-row,#loadingRow')
          .forEach(row => row.remove());
      }

      function messageRow(message,cssClass) {
        removeDataRows();
        const tr=document.createElement('tr');
        tr.className=cssClass === 'error-state' ? 'error-data-row' : 'empty-data-row';
        const td=document.createElement('td');
        td.colSpan=6;
        td.className=cssClass;
        td.textContent=message;
        tr.appendChild(td);
        els.tableBody.appendChild(tr);
      }

      // Fit the table to the actual embed width. Awareness/Challenge collapse
      // towards heading width while unused; Situation/Self-analysis/Replace
      // receive the reclaimed space. The editable row stays usable.
      function sizeColumns(entries) {
        const cols=document.querySelectorAll('colgroup col');
        const table=document.querySelector('.table-scroll table');
        if(cols.length!==6 || !table)return;

        const width=Math.max(700,Math.floor(table.parentElement.clientWidth));
        const dateWidth=100;
        const lengthAt=(index)=>{
          const lengths=entries.slice(0,500)
            .map(entry=>String((entry.cells||[])[index]||'').trim().length)
            .sort((a,b)=>a-b);
          return lengths.length
            ? lengths[Math.floor((lengths.length-1)*0.8)] : 0;
        };
        const populatedFraction=(index)=>{
          if(!entries.length)return 0;
          return entries.slice(0,500)
            .filter(entry=>String((entry.cells||[])[index]||'').trim()!=='').length
            /Math.min(entries.length,500);
        };
        const compactWidth=(index)=>{
          if(populatedFraction(index)<0.4)return 88;
          return Math.min(175,88+Math.max(0,lengthAt(index)-14)*2.2);
        };
        const awarenessWidth=compactWidth(2);
        const challengeWidth=compactWidth(4);
        const openWidth=Math.max(0,width-dateWidth-awarenessWidth-challengeWidth);
        const roomy=[1,3,5];
        const weights=roomy.map(i=>Math.max(12,Math.min(62,lengthAt(i)||0)));
        const total=weights.reduce((a,b)=>a+b,0);

        const widths=[dateWidth,0,awarenessWidth,0,challengeWidth,0];
        roomy.forEach((index,n)=>{widths[index]=openWidth*weights[n]/total;});
        widths.forEach((w,i)=>{cols[i].style.width=w.toFixed(2)+'px';});
      }

      function isDuplicateHeader(entry) {
        const cells=(entry && entry.cells)||[];
        const normalise=value=>String(value==null?'':value)
          .toLowerCase().replace(/[^a-z0-9]/g,'');
        const matches=HEADERS.reduce((count,heading,index)=>
          count+(normalise(cells[index])===normalise(heading)?1:0),0);
        const nonblank=cells.slice(0,6).filter(value=>String(value==null?'':value).trim()).length;
        // Exclude duplicate or partly filled header rows without hiding dated entries.
        return normalise(cells[0])==='date' || matches>=4 ||
          (matches>=3 && matches===nonblank);
      }

      function renderRows(entries) {
        removeDataRows();
        sizeColumns(entries);
        if (!entries.length) {
          messageRow('No saved entries yet','empty-state');
          return;
        }
        const fragment=document.createDocumentFragment();
        entries.forEach(entry => {
          const row=document.createElement('tr');
          row.className='data-row';
          (entry.cells||[]).slice(0,6).forEach((raw,index) => {
            const td=document.createElement('td');
            td.dataset.label=HEADERS[index];
            const value=raw==null?'':String(raw).trim();
            td.textContent=value||'—';
            if(index===0)td.classList.add('date-cell');
            if(!value)td.classList.add('empty-cell');
            row.appendChild(td);
          });
          fragment.appendChild(row);
        });
        els.tableBody.appendChild(fragment);
      }

      function renderPayload(payload) {
        if (!payload || payload.ok !== true || !Array.isArray(payload.entries)) {
          throw new Error(payload && payload.error ? payload.error : 'Unexpected backend response.');
        }
        state.entries=payload.entries.filter(entry=>!isDuplicateHeader(entry));
        state.hasLoaded=true;
        if (!state.pendingSave) els.saveButton.disabled=false;
        renderHeaders(payload.headers || HEADERS);
        renderRows(state.entries);
        if (payload.todayLabel){
          els.todayLabel.textContent=payload.todayLabel;
          els.mobileTodayLabel.textContent=payload.todayLabel;
        }
        setDataState('live','LIVE data');
        setLoading(false);
      }

      async function loadEntries({ quiet=false } = {}) {
        if (state.busyLoading) return;
        state.busyLoading=true;
        if(!quiet){setLoading(true);setDataState('','Loading…');}
        try {
          const payload=await jsonp('list');
          renderPayload(payload);
        } catch(error) {
          console.error(error);
          setLoading(false);
          setDataState('error','Unavailable');
          if(!quiet || !state.entries.length) {
            messageRow('Could not load Sheet1: '+(error.message||String(error)),'error-state');
          }
        } finally {state.busyLoading=false;}
      }

      function valuesFromInput() {
        return {
          situation:els.situation.value.trim(),
          awareness:els.awareness.value.trim(),
          selfAnalysis:els.selfAnalysis.value.trim(),
          challenge:els.challenge.value.trim(),
          replace:els.replace.value.trim()
        };
      }

      function setSaving(active) {
        els.saveButton.disabled=active;
        els.saveButton.textContent=active?'Saving…':'Save';
        if(active)setDataState('saving','Saving…');
      }

      function setMobileEditorOpen(open) {
        els.newEntryRow.classList.toggle('is-open',open);
        els.mobileEntryToggle.setAttribute('aria-expanded',String(open));
      }

      let savedLabelTimer=null;
      els.mobileEntryToggle.addEventListener('click',()=>{
        window.clearTimeout(savedLabelTimer);
        els.mobileEntryLabel.textContent='New entry';
        const opening=els.mobileEntryToggle.getAttribute('aria-expanded')!=='true';
        setMobileEditorOpen(opening);
        if(opening)els.situation.focus({preventScroll:true});
      });

      function finishSave(error) {
        const pending=state.pendingSave;
        if (!pending) return;
        window.clearTimeout(pending.timeout);
        state.pendingSave=null;
        setSaving(false);
        if (error) {
          setDataState('error','Save not confirmed');
          setEntryStatus(error.message||String(error),'error');
          return;
        }
        [els.situation,els.awareness,els.selfAnalysis,els.challenge,els.replace].forEach(input=>{
          input.value='';
          input.style.height='';
        });
        setDataState('live','LIVE data');
        setEntryStatus('Saved','success');
        if(window.matchMedia('(max-width:700px)').matches){
          setMobileEditorOpen(false);
          els.mobileEntryLabel.textContent='Saved';
          els.mobileEntryToggle.focus({preventScroll:true});
          window.clearTimeout(savedLabelTimer);
          savedLabelTimer=window.setTimeout(()=>{
            els.mobileEntryLabel.textContent='New entry';
          },3000);
        }else{
          els.situation.focus();
        }
      }

      async function confirmSave() {
        const pending=state.pendingSave;
        if (!pending || pending.checking) return;
        pending.checking=true;
        try {
          const payload=await jsonp('list');
          if (payload.ok !== true || !Array.isArray(payload.entries))
            throw new Error(payload.error||'Could not verify the saved entry.');
          const newItem=payload.entries.find(entry => {
            if (pending.row && Number(entry.row)===Number(pending.row))return true;
            if (pending.beforeRows.has(Number(entry.row)))return false;
            const values=(entry.cells||[]).slice(1,6).map(x=>String(x||'').trim());
            return values.every((value,i)=>value===Object.values(pending.values)[i]);
          });
          renderPayload(payload);
          if (newItem) {
            finishSave(null);
          } else if (pending.attempts++ < 4) {
            pending.checking=false;
            window.setTimeout(confirmSave,650);
            return;
          } else {
            finishSave(new Error('Save could not be confirmed. Please check Sheet1 before trying again to avoid a duplicate entry.'));
          }
        } catch(error) {
          pending.checking=false;
          if (pending.attempts++ < 4) {
            window.setTimeout(confirmSave,900);
          } else {
            finishSave(new Error('Could not verify the save: '+(error.message||String(error))+'. Check Sheet1 before retrying.'));
          }
          return;
        }
        if(state.pendingSave)state.pendingSave.checking=false;
      }

      // POST with a hidden iframe, matching Mmood's cross-origin save approach.
      // Saving is reported as successful only after a subsequent verified read.
      function saveEntry(event) {
        event.preventDefault();
        if(state.pendingSave)return;
        if (!state.hasLoaded) {
          setEntryStatus('Please allow the worksheet to load before saving.','error');
          return;
        }
        if (!backendReady()) {
          setEntryStatus('The Apps Script backend URL has not been configured.','error');
          return;
        }
        const values=valuesFromInput();
        if(!Object.values(values).some(Boolean)) {
          setEntryStatus('Type something into the new row before saving.','error');
          els.situation.focus();
          return;
        }
        const requestId=Date.now()+'-'+Math.random().toString(36).slice(2);
        state.pendingSave={
          requestId,values,
          beforeRows:new Set(state.entries.map(e=>Number(e.row))),
          attempts:0,checking:false,row:null,
          timeout:window.setTimeout(() => {
            if(state.pendingSave && state.pendingSave.requestId===requestId)
              finishSave(new Error('Save timed out. Check Sheet1 before trying again to avoid duplicates.'));
          },CONFIG.saveTimeoutMs)
        };
        setSaving(true);
        setEntryStatus('');
        const form=document.createElement('form');
        form.method='POST';
        form.action=CONFIG.backendUrl;
        form.target='htwSaveFrame';
        form.style.display='none';
        const fields={action:'add',requestId,...values};
        Object.entries(fields).forEach(([name,value])=>{
          const input=document.createElement('input');
          input.type='hidden';
          input.name=name;
          input.value=value;
          form.appendChild(input);
        });
        document.body.appendChild(form);
        form.submit();
        form.remove();
      }

      // Depending on Google sandboxing the postMessage may not arrive directly;
      // iframe load + re-reading the sheet remains a reliable fallback.
      window.addEventListener('message',event=>{
        const pending=state.pendingSave;
        const data=event.data;
        if(!pending || !data || data.type!=='htw-save')return;
        if(String(data.requestId)!==pending.requestId)return;
        if(data.payload && data.payload.ok===false){
          finishSave(new Error(data.payload.error||'Could not save entry.'));
          return;
        }
        if(data.payload && data.payload.ok===true){
          pending.row=data.payload.row;
          window.setTimeout(confirmSave,200);
        }
      });

      els.saveFrame.addEventListener('load',()=>{
        if(state.pendingSave)window.setTimeout(confirmSave,350);
      });

      function autoGrow(textarea) {
        textarea.style.height='auto';
        textarea.style.height=(window.matchMedia('(max-width:700px)').matches ? textarea.scrollHeight : Math.min(textarea.scrollHeight,180))+'px';
      }

      document.querySelectorAll('.entry-input').forEach(textarea=>{
        textarea.addEventListener('input',()=>{
          autoGrow(textarea);
          if (!state.pendingSave && !els.entryStatus.hidden) setEntryStatus('');
        });
        textarea.addEventListener('keydown',event=>{
          if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){
            event.preventDefault();
            els.entryForm.requestSubmit();
          }
        });
      });

      renderHeaders(HEADERS);
      els.saveButton.disabled=true;
      els.entryForm.addEventListener('submit',saveEntry);
      window.addEventListener('resize',()=>{
        updateStickyHeaderOffset();
        sizeColumns(state.entries);
      });
      loadEntries();
      window.setInterval(()=>{
        if(!state.pendingSave)loadEntries({quiet:true});
      },CONFIG.refreshMs);
    })();
  </script>
</body>
</html>
